databases:
  - name: samarth-database
    databaseName: samarth
    user: samarth
    plan: free

services:
  - type: web
    name: samarth-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn samarth_project.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/categories/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: samarth-database
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.10
